 <!DOCTYPE html>
<html>

    <head>
        <title>baking Calculator</title>
    </head>

    <body>
        <section> 
            <h1>welcome to my recipes</h1>
            <p>and first iteration of this website</p> 
        </section>
        
        <section>
            <label for ="recipe-select">choose a recipe:</label>
            <select name="recipe" id="recipe-select">
                <option value="">-- recipes -- </option>
                <option value="cinnamon-rolls">cinnamon rolls</option>
                <option value="banana-bread">banana bread</option>
            
            </select>
            <div id="recipe-ingredients"></div>
        </section>

        <section>
            <h2>instructions</h2>
            <p>... otw ...</p>
        </section>
        <section>
            <h2>recipe scaler</h2>
            <p>original servings: <span id="original-servings">8</span></p>
            <label for="servings">desired servings:</label>
            <input type="number" id="servings" min="1">
    
            <p><button type="button" id="scale-button">scale recipe</button></p>           
        </section>
        <section>
            <h2>scaled recipe</h2>
            <div id="scaled-recipe">
            </div>
        </section>



    <script src="script.js"></script>




    </body>
</html>
